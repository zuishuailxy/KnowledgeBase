# Milvus Standalone 部署
# 包含四个组件：
#   - etcd       : 元数据存储
#   - minio      : 对象存储（向量数据持久化）
#   - standalone : Milvus 主服务
#   - attu       : Milvus 图形化管理界面（http://localhost:8000）
#
# 注意：Milvus v2.5.x 必须搭配 Attu v2.5.x（Attu v3 只支持 Milvus 3.x）
#
# 启动：docker compose up -d
# 停止：docker compose down
# 清空数据（含 volumes）：docker compose down -v

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001" # MinIO 控制台
      - "9000:9000" # MinIO API
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530" # Milvus gRPC 端口（客户端连接用）
      - "9091:9091" # Milvus 健康检查端口
    depends_on:
      - etcd
      - minio

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.5.10 # 与 Milvus v2.5.x 匹配
    environment:
      # 必须用 Docker 服务名，不能用 localhost（容器内 localhost 指向自己）
      MILVUS_URL: standalone:19530
    ports:
      - "8000:3000" # Attu Web 界面
    depends_on:
      - standalone

networks:
  default:
    name: milvus
